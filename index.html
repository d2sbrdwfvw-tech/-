<style>:root{
  --bg:#eef2f6;--surface:#ffffff;--sunk:#f5f7fa;--ink:#132132;--muted:#5f6d7e;--line:#dde3ea;
  --accent:#1d4d78;--accent-ink:#ffffff;--accent-soft:#e3edf6;--amber:#e39b2d;--amber-soft:#fcf1df;
  --good:#1b7f52;--good-soft:#e2f3ea;--bad:#b83a2e;--bad-soft:#f9e5e2;--warn:#a86c10;--warn-soft:#fbf0dc;
  --shadow:0 1px 2px rgba(16,32,50,.06),0 4px 14px rgba(16,32,50,.06);
  --r:14px;--f:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1620;--surface:#16212d;--sunk:#1b2836;--ink:#e8eef5;--muted:#9aa9ba;--line:#26364a;
  --accent:#5b9bd5;--accent-ink:#0b1622;--accent-soft:#1c3045;--amber:#f0b04f;--amber-soft:#3a2c14;
  --good:#4cc38a;--good-soft:#173a2a;--bad:#ef7a6c;--bad-soft:#3d1f1b;--warn:#e8b45a;--warn-soft:#3a2d14;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1620;--surface:#16212d;--sunk:#1b2836;--ink:#e8eef5;--muted:#9aa9ba;--line:#26364a;
  --accent:#5b9bd5;--accent-ink:#0b1622;--accent-soft:#1c3045;--amber:#f0b04f;--amber-soft:#3a2c14;
  --good:#4cc38a;--good-soft:#173a2a;--bad:#ef7a6c;--bad-soft:#3d1f1b;--warn:#e8b45a;--warn-soft:#3a2d14;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
#app{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.appbar{position:sticky;top:0;z-index:20;background:var(--accent);color:var(--accent-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.appbar h1{margin:0;font-size:1.12rem;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{font-size:.75rem;opacity:.8;font-weight:500}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:inherit;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
main{padding:14px 16px}
.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;width:100%;max-width:760px}
.tabbar button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.72rem;cursor:pointer;position:relative}
.tabbar button svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar .dot{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:.62rem;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
h2{font-size:1.02rem;margin:0}
h3{font-size:.92rem;margin:0}
.muted{color:var(--muted)}.small{font-size:.82rem}.xs{font-size:.74rem}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.kpi .l{font-size:.78rem;color:var(--muted)}
.kpi .v{font-size:1.25rem;font-weight:700;margin-top:2px}
.kpi .v small{font-size:.72rem;font-weight:500;color:var(--muted)}
.kpi.hero{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.kpi.hero .l,.kpi.hero .v small{color:inherit;opacity:.85}
.kpi.hero .v{font-size:1.6rem}
.pos{color:var(--good)}.negv{color:var(--bad)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn svg{width:18px;height:18px}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.good{background:var(--good);color:#fff}.btn.bad{background:var(--bad);color:#fff}.btn.amber{background:var(--amber);color:#1b1206}
.btn.sm{padding:7px 12px;min-height:36px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.amber{background:var(--amber-soft);color:var(--warn)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;width:100%;cursor:pointer;color:var(--ink)}
.item:last-child{border-bottom:0}
.item .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.item .ic svg{width:22px;height:22px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t>span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .e{text-align:end;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.item>svg.chev{width:16px;height:16px;color:var(--muted);flex:none}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:.84rem;white-space:nowrap;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:end;font-weight:600;min-width:0;overflow-wrap:anywhere}
.sum{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.sum .spread.tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:700;font-size:1rem}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.note{padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:.86rem}
.note.warn{background:var(--warn-soft);color:var(--warn)}.note.good{background:var(--good-soft);color:var(--good)}.note.bad{background:var(--bad-soft);color:var(--bad)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.alert:last-child{border-bottom:0}
.alert svg{width:18px;height:18px;flex:none;margin-top:2px}
.alert.bad svg{color:var(--bad)}.alert.warn svg{color:var(--warn)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{background:var(--sunk);color:var(--muted);font-weight:600;font-size:.76rem}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--sunk)}
.fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));inset-inline-start:max(16px,calc(50% - 364px));z-index:25;width:56px;height:56px;border-radius:18px;background:var(--amber);color:#1b1206;border:0;box-shadow:0 6px 18px rgba(0,0,0,.2);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,16,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h2{flex:1}
.sheet .body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet footer .btn{flex:1}
.xbtn{width:36px;height:36px;border-radius:10px;border:0;background:var(--sunk);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.xbtn svg{width:18px;height:18px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:.82rem;color:var(--muted);font-weight:600}
.fld>span i{color:var(--bad);font-style:normal}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:11px;padding:10px 12px;min-height:44px}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select,.fld textarea:focus{outline-color:var(--accent)}
.fld .hint{font-size:.74rem;color:var(--muted)}
.fld.err input,.fld.err select{border-color:var(--bad)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.photo-in{display:flex;align-items:center;gap:10px}
.photo-in img,.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}
.photo-in label{cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
/* login */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px;gap:18px;max-width:420px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:54px;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .logo svg{width:32px;height:32px}
.brand h1{margin:0;font-size:1.3rem}
.users{display:grid;gap:8px}
.users button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:start;color:var(--ink)}
.users button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.pin{letter-spacing:.6em;text-align:center;font-size:1.3rem}
/* chart */
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--accent)}
.bars .b i.neg{background:var(--bad)}
.bars .b span{font-size:.68rem;color:var(--muted)}
.bars .b em{font-style:normal;font-size:.66rem;font-weight:700}
/* invoice/print */
.inv{background:#fff;color:#111;padding:22px;border-radius:12px;border:1px solid var(--line)}
.inv h2{font-size:1.3rem}
.inv table th{background:#f2f4f7;color:#333}
.inv .tot td{font-weight:700}
@media print{
  body{background:#fff}
  .appbar,.tabbar,.fab,.noprint,.toast{display:none!important}
  #app{padding:0;max-width:none}
  main{padding:0}
  .inv{border:0;padding:0}
}
@media (max-width:380px){.fgrid{grid-template-columns:1fr}.kpi .v{font-size:1.1rem}}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}.kpi.hero{grid-column:span 2}}

/* ---------- photos (IndexedDB) ---------- */
let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('naql-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>res(null)}catch(e){res(null)}})}
function photoPut(id,data){return new Promise(res=>{if(!idb)return res(false);try{const tx=idb.transaction('p','readwrite');tx.objectStore('p').put(data,id);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}
function photoGet(id){return new Promise(res=>{if(!idb)return res(null);try{const r=idb.transaction('p').objectStore('p').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}})}
const photoCache={};
async function hydratePhotos(root){for(const img of root.querySelectorAll('img[data-ph]')){const id=img.dataset.ph;if(!photoCache[id])photoCache[id]=await photoGet(id);if(photoCache[id])img.src=photoCache[id];else img.style.display='none'}}
function shrink(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=1100,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

const P={

};

/* ---------- money calculations ---------- */
const tripTotal=p=>r2(p.price*(1+(p.vat??S.settings.vat)/100));
const tripVat=p=>r2(tripTotal(p)-p.price);
const tripExp=p=>r2(sum(p.expenses,e=>e.amount));
const tripPaid=p=>r2(sum(p.payments,y=>y.amount));
const tripDue=p=>r2(tripTotal(p)-tripPaid(p));
const isLive=p=>p.status!=='cancelled';
function payState(p){if(p.status!=='delivered')return null;if(p.confirmed)return 'pay_confirmed';const pd=tripPaid(p);if(pd<=0)return 'pay_unpaid';if(pd<tripTotal(p)-.01)return 'pay_partial';return 'pay_paid'}
const truckDrivers=id=>S.drivers.filter(d=>d.truckId===id&&d.status!=='ds_left');
const activeTrucks=()=>S.trucks.filter(x=>x.status!=='ts_stopped');
function truckAutoFixed(trk){return r2((+trk.insAnnual||0)/12+(trk.own==='own_loan'?(+trk.installment||0):0)+sum(truckDrivers(trk.id),d=>(+d.salary||0)+(+d.allow||0)))}
// the current month is charged only for the days elapsed so far, so mid-month profit isn't distorted
const monthFactor=m=>{if(m!==curMonth())return 1;const d=new Date();const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()/dim};
function truckFixed(id,m){const trk=byId('trucks',id);if(!trk)return 0;const n=Math.max(1,activeTrucks().length);
  return r2(monthFactor(m)*(truckAutoFixed(trk)+sum(S.fixed.filter(f=>f.month===m&&f.truckId===id),f=>f.amount)+sum(S.fixed.filter(f=>f.month===m&&!f.truckId),f=>f.amount)/n))}
function monthFixed(m){return r2(sum(S.trucks.filter(x=>x.status!=='ts_stopped'||S.fixed.some(f=>f.truckId===x.id&&f.month===m)),x=>truckFixed(x.id,m)))}
const tripsIn=(m,f)=>S.trips.filter(p=>isLive(p)&&monthOf(p.loadDate)===m&&(!f||f(p)));
function fixedShare(p){if(!p.truckId||!isLive(p))return 0;const m=monthOf(p.loadDate);const n=tripsIn(m,x=>x.truckId===p.truckId).length;return n?r2(truckFixed(p.truckId,m)/n):0}
const tripProfit=p=>r2(p.price-tripExp(p)-fixedShare(p));
const tripKm=p=>(+p.odoEnd>0&&+p.odoStart>=0&&+p.odoEnd>=+p.odoStart)?(+p.odoEnd-+p.odoStart):0;
const clientBalance=id=>r2(sum(S.trips.filter(p=>p.clientId===id&&p.status==='delivered'),tripDue));
function dueDateOf(p){const c=byId('clients',p.clientId);const base=(p.arrive||p.loadDate||'').slice(0,10);return addDays(base,c&&c.terms==='t_credit'?(+c.days||0):3)}
function monthStats(m){const ps=tripsIn(m);const rev=sum(ps,p=>p.price),vexp=sum(ps,tripExp),fx=monthFixed(m);return{trips:ps.length,rev:r2(rev),vexp:r2(vexp),fixed:fx,net:r2(rev-vexp-fx)}}

/* ---------- alerts ---------- */
function alerts(){const out=[],T0=today(),lim=+S.settings.alertDays||30;
  const docTxt=d=>{const n=daysBetween(T0,d);return n<0?t('expired'):t('expires_in',{n})};
  for(const trk of S.trucks){if(trk.status==='ts_stopped')continue;
    for(const k of ['istimara','insurance','inspection','opcard']){const d=trk.docs&&trk.docs[k];if(d&&daysBetween(T0,d)<=lim)out.push({lvl:daysBetween(T0,d)<0?'bad':'warn',txt:t('al_doc',{doc:t(k),p:trk.plate,d:docTxt(d)}),go:['truck',trk.id],sort:daysBetween(T0,d)})}
    if(+trk.serviceEvery&&(+trk.odo-(+trk.lastService||0))>=+trk.serviceEvery-500)out.push({lvl:'warn',txt:t('al_service',{p:trk.plate}),go:['truck',trk.id],sort:5})}
  for(const d of S.drivers){if(d.status==='ds_left')continue;for(const[k,f]of[['id_exp','idExp'],['lic_exp','licExp']]){const x=d[f];if(x&&daysBetween(T0,x)<=lim)out.push({lvl:daysBetween(T0,x)<0?'bad':'warn',txt:t('al_driver',{doc:t(k),n:d.name,d:docTxt(x)}),go:['driver',d.id],sort:daysBetween(T0,x)})}}
  for(const c of S.clients){const late=S.trips.filter(p=>p.clientId===c.id&&p.status==='delivered'&&tripDue(p)>.01&&dueDateOf(p)<T0);if(late.length)out.push({lvl:'bad',txt:t('al_overdue',{c:c.name,a:moneyT(sum(late,tripDue))}),go:['client',c.id],sort:-50});
    if(+c.limit&&clientBalance(c.id)>+c.limit)out.push({lvl:'bad',txt:t('al_limit',{c:c.name}),go:['client',c.id],sort:-40})}
  for(const p of S.trips){if(!isLive(p))continue;const rt=byId('routes',p.routeId);
    if(rt&&p.status!=='new'){const used=sum(p.expenses.filter(e=>e.type==='ex_diesel'||e.type==='ex_driver'),e=>e.amount);if(used>((+rt.diesel||0)+(+rt.driver||0))*1.2&&daysBetween(p.loadDate,T0)<=45)out.push({lvl:'warn',txt:t('al_highcost',{n:p.no}),go:['trip',p.id],sort:10})}
    if(payState(p)==='pay_paid')out.push({lvl:'warn',txt:t('al_unconfirmed',{n:p.no}),go:['trip',p.id],sort:0})}
  return out.sort((a,b)=>a.sort-b.sort)}

/* ---------- trip status actions ---------- */
function tripAction(p,act){if(!guard('trips'))return;
  if(act==='schedule'){if(!p.truckId||!p.driverId)return tripForm(p);p.status='scheduled';log(`${t('st_scheduled')} ${p.no}`);save();render();return}
  if(act==='start'){if(!p.truckId||!p.driverId){toast(t('need_truck_driver'),'bad');return tripForm(p)}
    const trk=byId('trucks',p.truckId);
    openForm({title:t('act_start')+' · '+p.no,values:{odoStart:trk?trk.odo:'',depart:nowISO()},fields:[{k:'odoStart',l:t('odo_start'),type:'number',req:true,min:0},{k:'depart',l:t('depart'),type:'datetime-local',req:true}],
     onSave:v=>{Object.assign(p,v,{status:'onroad'});if(trk)trk.status='ts_trip';log(`${t('st_onroad')} ${p.no}`)}});return}
  if(act==='deliver'){const trk=byId('trucks',p.truckId),rt=byId('routes',p.routeId);
    openForm({title:t('act_deliver')+' · '+p.no,values:{odoEnd:rt&&+p.odoStart?+p.odoStart+(+rt.km||0):'',arrive:nowISO(),pod:p.pod||''},
     fields:[{k:'odoEnd',l:t('odo_end'),type:'number',req:true,min:0,hint:t('odo_start')+': '+nf(p.odoStart,0)},{k:'arrive',l:t('arrive'),type:'datetime-local',req:true},{k:'pod',l:t('pod'),type:'photo'}],
     onSave:v=>{if(+v.odoEnd<+p.odoStart)return t('odo_invalid');Object.assign(p,v,{status:'delivered'});if(trk){if(+v.odoEnd>+trk.odo)trk.odo=+v.odoEnd;if(trk.status==='ts_trip')trk.status='ts_available'}log(`${t('st_delivered')} ${p.no}`)}});return}
  if(act==='cancel'){ui.confirm={msg:t('act_cancel')+' '+p.no+'؟',ok:t('act_cancel'),fn:()=>{p.status='cancelled';const trk=byId('trucks',p.truckId);if(trk&&trk.status==='ts_trip')trk.status='ts_available';log(`${t('st_cancelled')} ${p.no}`)}};render();return}
}

V.reports=()=>{const m=ui.month,st=monthStats(m),ps=tripsIn(m),rt=ui.repTab;
  const groups={truck:[S.trucks,x=>x.plate,(x,p)=>p.truckId===x.id],driver:[S.drivers,x=>x.name,(x,p)=>p.driverId===x.id],client:[S.clients,x=>x.name,(x,p)=>p.clientId===x.id],route:[S.routes,x=>x.from+' - '+x.to,(x,p)=>p.routeId===x.id]};
  const [arr,name,match]=groups[rt];
  const rows=arr.map(x=>{const q=ps.filter(p=>match(x,p));const rev=sum(q,p=>p.price),ex=sum(q,tripExp),fx=rt==='truck'?truckFixed(x.id,m):sum(q,fixedShare),km=sum(q,tripKm),lit=sum(q,p=>sum(p.expenses.filter(e=>e.type==='ex_diesel'),e=>e.liters||0));
    return{n:name(x),trips:q.length,km,rev,ex,fx,net:rev-ex-fx,l100:km?lit/km*100:0,due:rt==='client'?clientBalance(x.id):null}}).filter(r=>r.trips||r.fx);
  ui._rep=rows;
  const cols=[['n',t(rt==='truck'?'truck':rt==='driver'?'driver':rt==='client'?'client':'route')],['trips',t('trips_count')],['km',t('km_total')],['rev',t('revenue')],['ex',t('var_costs')],['fx',t('fixed_costs')],['net',t('net_profit')]];
  if(rt==='truck')cols.push(['l100',t('l100')]);if(rt==='client')cols.push(['due',t('balance')]);if(rt==='route')cols.push(['avg',t('avg_profit')]);
  rows.forEach(r=>r.avg=r.trips?r.net/r.trips:0);ui._repCols=cols;
  const cell=(r,k)=>k==='n'?esc(r.n):k==='trips'||k==='km'?int(r[k]):k==='l100'?(r.l100?nf(r.l100,1):'—'):`<span class="num ${k==='net'&&r.net<0?'negv':''}">${nf(r[k])}</span>`;
  return bar(t('reports'),fmonth(m))+`<main class="stack"><div class="row noprint"><input type="month" class="search" style="max-width:200px" value="${m}" data-ch="month" aria-label="${esc(t('month'))}"><button class="btn ghost sm" data-act="print">${IC.printer}${esc(t('print'))}</button></div>
  ${sec(t('rep_summary'),`<div class="card sum"><div class="spread"><span>${esc(t('trips_count'))}</span><b>${int(st.trips)}</b></div><div class="spread"><span>${esc(t('revenue'))}</span><span>${money(st.rev)}</span></div><div class="spread muted"><span>− ${esc(t('var_costs'))}</span><span>${money(st.vexp)}</span></div><div class="spread muted"><span>− ${esc(t('fixed_costs'))}</span><span>${money(st.fixed)}</span></div><div class="spread tot"><span>${esc(t('net_profit'))}</span><span class="${st.net<0?'negv':'pos'}">${money(st.net)}</span></div></div>`)}
  <div class="seg noprint">${['truck','driver','client','route'].map(k=>`<button data-act="rep-tab" data-id="${k}" aria-pressed="${rt===k}">${esc(t('by_'+k))}</button>`).join('')}</div>
  ${rows.length?`<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${cell(r,c[0])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:emptyBox()}
  <button class="btn ghost noprint" data-act="csv-rep">${IC.save}${esc(t('export_csv'))}</button></main>`};

V.settings=()=>bar(t('settings'))+`<main class="stack">
  ${sec(t('language'),`<div class="seg">${LANGS.map(l=>`<button data-act="lang" data-id="${l[0]}" aria-pressed="${LANG===l[0]}">${l[1]}</button>`).join('')}</div>`)}
  ${sec(t('theme'),`<div class="seg">${['auto','light','dark'].map(k=>`<button data-act="theme" data-id="${k}" aria-pressed="${PREFS.theme===k}">${esc(t('th_'+k))}</button>`).join('')}</div>`)}
  ${can('*')?sec(t('company'),`<div class="card"><dl class="kv"><dt>${esc(t('company_name'))}</dt><dd>${esc(S.settings.company)}</dd><dt>${esc(t('vat_no'))}</dt><dd class="num">${esc(S.settings.vatNo||'—')}</dd><dt>${esc(t('vat_pct'))}</dt><dd class="num">${S.settings.vat}%</dd><dt>${esc(t('diesel_price'))}</dt><dd>${money(S.settings.dieselPrice)}</dd><dt>${esc(t('alert_days'))}</dt><dd class="num">${S.settings.alertDays}</dd></dl></div>`,`<button class="btn sec sm" data-act="settings-edit">${esc(t('edit'))}</button>`):''}
  ${can('*')?sec(t('backup'),`<div class="row"><button class="btn sec" data-act="backup">${IC.save}${esc(t('export_backup'))}</button><label class="btn ghost">${IC.upload}${esc(t('import_backup'))}<input type="file" accept="application/json,.json" data-restore hidden></label></div><button class="btn ghost sm" data-act="reset" style="color:var(--bad)">${esc(t('reset_demo'))}</button>`):''}
  <p class="note small">${esc(t('demo_note'))}</p></main>`;

/* ---------- render ---------- */
const NAV=[['home','home',IC.home],['trips','trips',IC.route],['fleet','fleet',IC.truck],['clients','clients',IC.users],['more','more',IC.grid]];
function applyLang(){const l=LANGS.find(x=>x[0]===LANG)||LANGS[0];document.documentElement.lang=l[0];document.documentElement.dir=l[2];document.title=t('appName');
  if(PREFS.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',PREFS.theme)}
function render(){applyLang();const app=$('#app');
  if(!SES){app.innerHTML=V.login();return}
  const s=cur();let html;
  if(s)html=V[s.type](s.id);else html=V[ui.tab]();
  const al=alerts().filter(a=>a.lvl==='bad').length;
  html+=`<nav class="tabbar" aria-label="nav"><div class="in">${NAV.map(([k,l,ic])=>`<button data-act="go" data-id="${k}" aria-current="${ui.tab===k?'page':'false'}">${ic}<span>${esc(t(l))}</span>${k==='home'&&al?`<span class="dot num">${al}</span>`:''}</button>`).join('')}</div></nav>`;
  if(ui.confirm)html+=`<div class="scrim" style="z-index:60" data-act="confirm-no"><div class="sheet" role="alertdialog" aria-modal="true"><div class="body"><p style="margin:0;font-weight:600">${esc(ui.confirm.msg)}</p>${ui.confirm.sub?`<p class="muted small" style="margin:0">${esc(ui.confirm.sub)}</p>`:''}</div><footer><button class="btn ghost" data-act="confirm-no">${esc(t('cancel'))}</button><button class="btn ${ui.confirm.kind||'bad'}" data-act="confirm-yes">${esc(ui.confirm.ok)}</button></footer></div></div>`;
  app.innerHTML=html;hydratePhotos(app)}

/* ---------- csv ---------- */
function downloadText(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function csv(name,head,rows){downloadText(name,'﻿'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}

/* ---------- actions ---------- */
const ACT={
 'go':id=>go(id),'pop':()=>pop(),'push':(id,el)=>push(el.dataset.type,el.dataset.id),
 'open':(id,el)=>{if(el.dataset.type==='client'&&ui.tab!=='clients'&&!ui.stack.length)ui.tab='clients';push(el.dataset.type,id)},
 'lang':id=>{LANG=id;PREFS.lang=id;savePrefs();render();if(ui.sheet)renderSheet()},
 'theme':id=>{PREFS.theme=id;savePrefs();render()},
 'login-pick':id=>{ui.loginUser=id;render();setTimeout(()=>{const p=$('#pin');if(p)p.focus()},30)},
 'login':()=>{const u=byId('users',ui.loginUser),p=$('#pin');if(!u||!p)return;if(p.value!==u.pin){toast(t('wrong_pin'),'bad');p.value='';p.focus();return}
   SES={id:u.id,name:u.name,role:u.role};try{localStorage.setItem(SES_KEY,JSON.stringify(SES))}catch(e){}ui.tab='home';ui.stack=[];render()},
 'logout':()=>{SES=null;try{localStorage.removeItem(SES_KEY)}catch(e){}ui.loginUser=null;ui.stack=[];render()},
 'trips-filter':id=>{ui.filter=id;ui.tab='trips';ui.stack=[];render()},
 'trip-new':()=>tripForm(null),
 'trip-edit':()=>tripForm(byId('trips',cur().id)),
 'trip-do':id=>tripAction(byId('trips',cur().id),id),
 'exp-new':()=>expenseForm(byId('trips',cur().id)),
 'exp-edit':id=>{const p=byId('trips',cur().id);if(p.confirmed||!can('expenses'))return;expenseForm(p,p.expenses.find(e=>e.id===id))},
 'pay-new':()=>paymentForm(byId('trips',cur().id)),
 'pay-edit':id=>{const p=byId('trips',cur().id);if(p.confirmed||!can('pay'))return;paymentForm(p,p.payments.find(y=>y.id===id))},
 'trip-confirm':()=>{if(!guard('*'))return;const p=byId('trips',cur().id);if(payState(p)!=='pay_paid')return toast(t('confirm_need_paid'),'bad');
   ui.confirm={msg:t('act_confirm')+' · #'+p.no,sub:t('confirm_q'),ok:t('act_confirm'),kind:'good',fn:()=>{p.confirmed={by:SES.name,at:nowISO()};log(`${t('act_confirm')} · ${t('trip')} ${p.no}`)}};render()},
 'trip-unlock':()=>{if(!guard('*'))return;const p=byId('trips',cur().id);ui.confirm={msg:t('act_unlock')+' · #'+p.no,ok:t('act_unlock'),fn:()=>{p.confirmed=null;log(`${t('act_unlock')} · ${t('trip')} ${p.no}`)}};render()},
 'invoice':()=>push('invoice',cur().id),
 'print':()=>window.print(),
 'fleet-tab':id=>{ui.fleetTab=id;render()},'client-tab':id=>{ui.clientTab=id;render()},'rep-tab':id=>{ui.repTab=id;render()},
 'truck-new':()=>truckForm(null),'truck-edit':()=>truckForm(byId('trucks',cur().id)),
 'truck-service':()=>{if(!guard('fleet'))return;const x=byId('trucks',cur().id);ui.confirm={msg:t('record_service')+' · '+x.plate,sub:t('odometer')+': '+nf(x.odo,0),ok:t('save'),kind:'',fn:()=>{x.lastService=+x.odo;log(`${t('record_service')} ${x.plate}`)}};render()},
 'driver-new':()=>driverForm(null),'driver-edit':()=>driverForm(byId('drivers',cur().id)),
 'custody-new':()=>custodyForm(byId('drivers',cur().id)),
 'tyre-new':id=>tyreForm(null,id||(cur()&&cur().type==='truck'?cur().id:'')),'tyre-edit':id=>{if(!can('fleet'))return;tyreForm(byId('tyres',id))},
 'client-new':()=>clientForm(null),'client-edit':()=>clientForm(byId('clients',cur().id)),
 'route-new':()=>routeForm(null),'route-edit':id=>{if(!can('routes'))return;routeForm(byId('routes',id))},
 'fixed-new':()=>fixedForm(null),'fixed-edit':id=>fixedForm(S.fixed.find(f=>f.id===id)),
 'user-new':()=>userForm(null),'user-edit':id=>userForm(byId('users',id)),
 'settings-edit':()=>settingsForm(),
 'sheet-close':()=>closeSheet(),'sheet-bg':(id,el,e)=>{if(e.target===el)closeSheet()},'sheet-ok':()=>sheetOK(),
 'sheet-del':()=>{const o=ui.sheet;ui.confirm={msg:t('confirm_delete'),ok:t('yes_delete'),fn:()=>{const r=o.onDel&&o.onDel();if(typeof r==='string'){toast(r,'bad');return false}closeSheet();toast(t('deleted'))}};render()},
 'confirm-no':(id,el,e)=>{if(e.target!==el&&el.classList.contains('scrim'))return;ui.confirm=null;render()},
 'confirm-yes':()=>{const c=ui.confirm;ui.confirm=null;const r=c.fn();if(r!==false){save();}render()},
 'csv-rep':()=>{const cols=ui._repCols,rows=ui._rep||[];csv(`report-${ui.repTab}-${ui.month}.csv`,cols.map(c=>c[1]),rows.map(r=>cols.map(c=>c[0]==='n'?r.n:c[0]==='l100'?(r.l100?r.l100.toFixed(1):''):typeof r[c[0]]==='number'?r2(r[c[0]]):r[c[0]])))},
 'csv-client':()=>{const c=byId('clients',cur().id),ps=S.trips.filter(p=>p.clientId===c.id&&p.status==='delivered');csv(`statement-${c.name}.csv`,[t('trip_no'),t('date'),t('from'),t('to'),t('price'),t('vat'),t('total_vat'),t('paid'),t('remaining'),t('due_date')],ps.map(p=>[p.no,p.loadDate,p.from,p.to,p.price,tripVat(p),tripTotal(p),tripPaid(p),Math.max(0,tripDue(p)),dueDateOf(p)]))},
 'backup':async()=>{const photos={};if(idb){const ids=[];JSON.stringify(S).replace(/"(ph_[a-z0-9]+)"/g,(m,id)=>ids.push(id));for(const id of ids)photos[id]=await photoGet(id)}
   downloadText(`backup-${today()}.json`,JSON.stringify({app:'naql',S,photos}),'application/json');toast(t('backup_done'))},
 'reset':()=>{ui.confirm={msg:t('reset_demo'),sub:t('reset_confirm'),ok:t('reset_demo'),fn:()=>{localStorage.removeItem(KEY);seed();ui.stack=[];ui.tab='home'}};render()},
 'photo-view':()=>{},
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;
  if(el.tagName==='A')e.preventDefault();f(el.dataset.id,el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin')ACT.login();
  if(e.key==='Escape'){if(ui.confirm){ui.confirm=null;render()}else if(ui.sheet)closeSheet()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('div[data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.fk){ui.form[el.dataset.fk]=el.value;if(el.closest('.fld'))el.closest('.fld').classList.remove('err');return}
  if(el.dataset.ch==='q'){ui.q=el.value;const pos=el.selectionStart;render();const n=$('.search[data-ch="q"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.fk&&ui.sheet){ui.form[el.dataset.fk]=el.value;const f=ui.sheet.fields.find(x=>x.k===el.dataset.fk);
    if(f&&f.onch)f.onch(ui.form);if(el.tagName==='SELECT')renderSheet();else if(f&&f.onch){for(const i of document.querySelectorAll('#sheet [data-fk]'))if(i!==el&&i.tagName==='INPUT'&&ui.form[i.dataset.fk]!==undefined)i.value=ui.form[i.dataset.fk]}return}
  if(el.dataset.ch==='month'){if(el.value){ui.month=el.value;render()}return}
  if(el.dataset.photo){const file=el.files&&el.files[0];if(!file)return;const data=await shrink(file);if(!data)return;const id='ph_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    if(!idb)await idbOpen();await photoPut(id,data);photoCache[id]=data;ui.form[el.dataset.photo]=id;renderSheet();return}
  if(el.hasAttribute('data-restore')){const file=el.files&&el.files[0];if(!file)return;try{const j=JSON.parse(await file.text());if(j.app!=='naql'||!j.S||!j.S.trips)throw 0;
    S=j.S;save();if(j.photos)for(const id in j.photos)if(j.photos[id])await photoPut(id,j.photos[id]);toast(t('import_done'));render()}catch(x){toast(t('import_bad'),'bad')}}});

/* ---------- boot ---------- */
load();idbOpen().then(()=>render());render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
